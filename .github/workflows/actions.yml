name: Update data.json

on:
  schedule:
    # GitHub actions can be delayed significantly, based on load, so run earlier, and offset from common times. 
    - cron: '48 11 * * 1-5' # at open (DST)
    - cron: '48 12 * * 1-5' # at open
    - cron: '12 15 * * 1-5' # halfway through the day
    - cron: '22 18 * * 1-5' # closing (DST) -- note that quotes can be delayed
    - cron: '22 19 * * 1-5' # closing
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:

      - name: checkout repo content
        uses: actions/checkout@v3 # checkout the repository content to github runner

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # install the python version needed
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps firefox

      - name: monkey-patch wetrade file (etrade API fetch size)
        shell: pwsh
        run: |
          $matches = pip show wetrade | Select-String -Pattern '(?<=Location: )[^\n]+'
          $path = $matches.Matches.Value + '/wetrade/api.py';
          (Get-Content $path) -replace 'v1/accounts/{}/portfolio.json', 'v1/accounts/{}/portfolio.json?count=1000&totalsRequired=true' | Set-Content $path

      - name: monkey-patch wetrade file (traceback.format_exception signature, Python 3.13+)
        shell: pwsh
        run: |
          $matches = pip show wetrade | Select-String -Pattern '(?<=Location: )[^\n]+'
          $path = $matches.Matches.Value + '/wetrade/utils.py';
          (Get-Content $path) -replace 'traceback.format_exception\(etype=type\(e\), value=e, tb=e.__traceback__\)', 'traceback.format_exception(e)' | Set-Content $path

      - name: monkey-patch wetrade file (login timing out on slow runners)
        run: |
          python - <<'EOF'
          import pathlib, wetrade
          p = pathlib.Path(wetrade.__file__).parent / 'user_session.py'
          s = p.read_text()
          s = s.replace(
            "page.goto('https://us.etrade.com/etx/pxy/login')",
            "page.goto('https://us.etrade.com/etx/pxy/login', wait_until='domcontentloaded')")
          s = s.replace(
            "!= 'https://us.etrade.com/etx/pxy/login', timeout=8000)",
            "!= 'https://us.etrade.com/etx/pxy/login', timeout=45000, wait_until='domcontentloaded')")
          p.write_text(s)
          EOF
          grep -n "domcontentloaded" "$(python -c 'import wetrade,os;print(os.path.dirname(wetrade.__file__))')/user_session.py"

      - name: fetch new data and update file
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: python main.py
          
      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "updated data" --allow-empty)
          
      - name: push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main 
